<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Rubiksports — an interactive 2×2, 3×3 and 4×4 Rubik's cube simulator with timer, move log, auto-solve and scenic themes.">
  <title>Rubiksports — Play the cube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Cg%3E%3Crect x='5' y='5' width='6' height='6' rx='1.2' fill='%23c8102e'/%3E%3Crect x='13' y='5' width='6' height='6' rx='1.2' fill='%23ffd500'/%3E%3Crect x='21' y='5' width='6' height='6' rx='1.2' fill='%230051ba'/%3E%3Crect x='5' y='13' width='6' height='6' rx='1.2' fill='%2300a651'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1.2' fill='%23f5f5f5'/%3E%3Crect x='21' y='13' width='6' height='6' rx='1.2' fill='%23ff6b00'/%3E%3Crect x='5' y='21' width='6' height='6' rx='1.2' fill='%23ffd500'/%3E%3Crect x='13' y='21' width='6' height='6' rx='1.2' fill='%23c8102e'/%3E%3Crect x='21' y='21' width='6' height='6' rx='1.2' fill='%2300a651'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><g><rect x="3" y="3" width="8" height="8" rx="1.6" fill="#c8102e"/><rect x="12" y="3" width="8" height="8" rx="1.6" fill="#ffd500"/><rect x="21" y="3" width="8" height="8" rx="1.6" fill="#0051ba"/><rect x="3" y="12" width="8" height="8" rx="1.6" fill="#00a651"/><rect x="12" y="12" width="8" height="8" rx="1.6" fill="#f5f5f5"/><rect x="21" y="12" width="8" height="8" rx="1.6" fill="#ff6b00"/><rect x="3" y="21" width="8" height="8" rx="1.6" fill="#ffd500"/><rect x="12" y="21" width="8" height="8" rx="1.6" fill="#c8102e"/><rect x="21" y="21" width="8" height="8" rx="1.6" fill="#00a651"/></g></svg>
        <span>Rubiksports</span>
      </div>
      <div class="seg" id="sizes" role="group" aria-label="Cube size">
        <button type="button" data-size="2">2×2</button>
        <button type="button" data-size="3">3×3</button>
        <button type="button" data-size="4">4×4</button>
      </div>
      <nav class="themes" id="themes" aria-label="Background theme"></nav>
    </header>

    <section class="stage" id="stage">
      <canvas id="cube-canvas" aria-label="Interactive Rubik's cube. Drag a layer to turn it; drag the background to rotate the view."></canvas>
      <div class="hud glass" aria-live="polite">
        <div id="timer" class="timer">00:00.00</div>
        <div id="status" class="status">Press Randomize, then Start</div>
        <div class="hud-row"><span>Moves <b id="moves">0</b></span><span>Best <b id="best">—</b></span></div>
      </div>
      <canvas id="confetti" aria-hidden="true"></canvas>
      <div class="hint" id="hint">Drag the cube to turn a layer · drag the background to rotate · pinch or scroll to zoom</div>
    </section>

    <aside class="panel glass">
      <div class="controls">
        <button type="button" id="btnRandom" class="btn"><span class="ico">🔀</span><span class="lbl">Randomize</span></button>
        <button type="button" id="btnSolve" class="btn accent"><span class="ico">🧩</span><span class="lbl">Solve it</span></button>
        <button type="button" id="btnTimer" class="btn"><span class="ico">⏱️</span><span class="lbl" id="btnTimerLbl">Start</span></button>
        <button type="button" id="btnReset" class="btn"><span class="ico">↺</span><span class="lbl">Reset</span></button>
      </div>

      <div class="settings">
        <button type="button" id="btnSound" class="mini sound" aria-pressed="true" aria-label="Sound effects">🔊 Sound on</button>
        <label class="speed">Speed <input type="range" id="speed" min="1" max="5" step="1" value="3" aria-label="Animation speed"></label>
        <details class="pad">
          <summary>Move pad</summary>
          <div id="pad" class="padgrid"></div>
        </details>
      </div>

      <div class="log-head">
        <h2>Move log</h2>
        <span id="logCount" class="count">0 moves</span>
        <span class="spacer"></span>
        <button type="button" id="btnCopy" class="mini">Copy</button>
        <button type="button" id="btnClearLog" class="mini">Clear</button>
      </div>
      <div id="log" class="log" role="log" aria-live="off" data-empty="Moves appear here — scramble, your turns and the solver."></div>
      <p class="keys">Keys: <kbd>R</kbd> <kbd>L</kbd> <kbd>U</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>B</kbd> turn a face · hold <kbd>Shift</kbd> for the inverse (′)</p>
    </aside>
  </div>

  <noscript><p style="position:fixed;inset:auto 0 0 0;padding:12px;background:#fff;color:#000;text-align:center">Rubiksports needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
